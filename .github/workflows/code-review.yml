# Auto code review on every Pull Request
# Runs lint and just test (Python + JS). Fails the PR if any step fails.

name: Code Review

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --all-packages

      # Lint all workspaces that have a "lint" script
      - name: Lint
        run: pnpm -r run lint

      # Test – just test (Python + JS) on every PR and push to main/develop
      - name: Test
        run: just test
