[project]
name = "evals"
version = "0.1.0"
description = "Evaluation framework for actBI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-evals>=0.1.0",
    # Agents package for testing agents
    "agents",
    # Shared data types
    "shared-data",
    # Framework dependencies
    "scikit-learn>=1.5.0",
    "polars>=1.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    # Assertion framework
    "jsonpath-ng>=1.6.0",
    # OpenTelemetry for workflow tracing
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-langchain>=0.1.0",
]

[tool.uv.sources]
agents = { workspace = true }
shared-data = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "src/evals"]
pythonpath = ["src"]
asyncio_mode = "auto"
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: Integration tests (require LLM API, run with -m integration)",
]

[project.scripts]
eval = "evals.cli:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["**/*.py", "**/*.json", "**/*.jsonl", "**/*.yaml"]
