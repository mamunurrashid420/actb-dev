# IntentClassifier evaluation dataset
# Tests classification of user queries into task/mode/job dimensions

# === Consult/Reporter cases ===
- name: show_revenue
  inputs:
    message_text: Show Q4 revenue by region
  assert:
    - { type: equals, field: task, value: consult }
    - { type: equals, field: mode, value: reporter }
    - { type: equals, field: job, value: query }
    - { type: in-range, field: confidence, min: 0.8, max: 1.0 }
    - { type: not-null, field: rationale }
    - { type: not-null, field: extracted_entities }
  metadata:
    category: consult_reporter

- name: plot_trends
  inputs:
    message_text: Plot Apple's revenue over the last 5 years
  assert:
    - { type: equals, field: task, value: consult }
    - { type: equals, field: mode, value: reporter }
    - { type: equals, field: job, value: visualize }
    - { type: in-range, field: confidence, min: 0.8, max: 1.0 }
    - { type: not-null, field: rationale }
    - { type: not-null, field: extracted_entities }
  metadata:
    category: consult_reporter

