[project]
name = "shared-data"
version = "0.1.0"
description = "Data asset loading utilities for the actBI monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shared-io",
    "pandas>=2.0",
    "polars>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14.10",
]

[tool.uv.sources]
shared-io = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
