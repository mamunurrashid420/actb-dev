  # ===========================================================================
  # TEST CASE 4: Revenue vs Costs with Margin Trend (Combo Chart)
  # ===========================================================================
  - id: tc_004_revenue_vs_cost_trend

    nlp_query: Plot revenue versus operating costs over the last 8 quarters with profit margin trend

    expected_chart:
      id: chart_revenue_cost_margin_v1
      title: Revenue vs Operating Costs with Profit Margin Trend
      chart_type: combo
      combo_types: [bar_chart_vertical, line_chart] # bar for revenue/costs, line for margin trend
      dimensions:
        - field: quarter
          type: time
        - field: revenue
          type: numeric
        - field: operating_costs
          type: numeric
        - field: profit_margin_pct
          type: numeric
      filters: []
      chart_config:
        primary_axis:
          type: bar_chart_vertical
          fields: [revenue, operating_costs]
          stacked: false
        secondary_axis:
          type: line_chart
          fields: [profit_margin_pct]
      version: 1
      schema_version: 1

    output_schema:
      id: schema_revenue_cost_margin_v1
      version: 1
      fields:
        - name: row_id
          type: STRING
          role: IDENTIFIER
          context: Stable identifier for each quarterly record
        - name: quarter
          type: STRING
          role: DIMENSION
          context: Fiscal quarter label (e.g., Q1 2024)
        - name: revenue
          type: FLOAT
          role: MEASURE
          context: Total revenue in millions USD
        - name: operating_costs
          type: FLOAT
          role: MEASURE
          context: Total operating costs in millions USD
        - name: gross_profit
          type: FLOAT
          role: MEASURE
          context: Gross profit in millions USD (revenue - operating_costs)
        - name: profit_margin_pct
          type: FLOAT
          role: MEASURE
          context: Profit margin as percentage (0-100)
      primary_key: [row_id]
      schema_version: 1

    materialized_data:
      schema_id: schema_revenue_cost_margin_v1
      rows:
        - {
            row_id: r1,
            quarter: Q1 2024,
            revenue: 45.2,
