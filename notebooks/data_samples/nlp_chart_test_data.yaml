        - name: row_id
          type: STRING
          role: IDENTIFIER
          context: Stable identifier for each cohort-period combination
        - name: cohort_month
          type: STRING
          role: DIMENSION
          context: Month when customers signed up (YYYY-MM)
        - name: months_since_signup
          type: INTEGER
          role: DIMENSION
          context: Number of months elapsed since signup (0 = signup month)
        - name: cohort_size
          type: INTEGER
          role: MEASURE
          context: Number of customers in the cohort at signup
        - name: active_customers
          type: INTEGER
          role: MEASURE
          context: Number of customers still active in this period
        - name: retention_rate
          type: FLOAT
          role: MEASURE
