  # ===========================================================================
  # TEST CASE 3: Cohort Retention Analysis (Cohort Heatmap)
  # ===========================================================================
  - id: tc_003_customer_cohort_retention

    nlp_query: Show me customer retention rates by signup cohort over the past 6 months

    expected_chart:
      id: chart_cohort_retention_v1
      title: Customer Retention by Signup Cohort
      chart_type: cohort_heatmap
      dimensions:
        - field: cohort_month
          type: time
        - field: months_since_signup
          type: numeric
        - field: retention_rate
          type: numeric
      filters: []
      version: 1
      schema_version: 1

