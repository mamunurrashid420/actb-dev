      title: Order Value Distribution by Customer Segment
      chart_type: boxplot
      dimensions:
        - field: customer_segment
          type: category
        - field: order_value
          type: numeric
      filters: []
      chart_config:
        show_outliers: true
        show_mean: true
        orientation: vertical
      version: 1
      schema_version: 1

    output_schema:
      id: schema_order_value_distribution_v1
      version: 1
