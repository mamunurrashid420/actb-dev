# NLP-to-Chart Test Data
# Following CustomerChartStore design patterns
# Version: 1.0.0

metadata:
  version: "1.0.0"
  created_at: "2025-01-21"
  description: Test data for NLP-to-chart pipeline validation
  field_types: [STRING, INTEGER, FLOAT, BOOLEAN]
  field_roles: [IDENTIFIER, DIMENSION, MEASURE, ATTRIBUTE]
  supported_chart_types:
    - bar_chart_vertical
    - bar_chart_horizontal
    - line_chart
    - area_chart
    - scatter_plot
    - pie_chart
    - donut_chart
    - heatmap
    - cohort_heatmap
    - boxplot
    - violin_plot

test_cases:
  # ===========================================================================
  # TEST CASE 1: Simple Monthly Sales (Bar Chart)
  # ===========================================================================
  - id: tc_001_monthly_sales

    nlp_query: Show me the monthly sales numbers for the last twelve months

    expected_chart:
      id: chart_monthly_sales_v1
      title: Monthly Sales (Last 12 Months)
      chart_type: bar_chart_vertical
      dimensions:
        - field: month
          type: time
        - field: sales_amount
          type: numeric
      filters: []
      version: 1
      schema_version: 1

    output_schema:
      id: schema_monthly_sales_v1
      version: 1
      fields:
        - name: row_id
          type: STRING
          role: IDENTIFIER
          context: Stable identifier for each monthly record
        - name: month
          type: STRING
          role: DIMENSION
          context: Month label in YYYY-MM format
        - name: sales_amount
          type: FLOAT
          role: MEASURE
          context: Total sales amount in USD for the month
      primary_key: [row_id]
      schema_version: 1

    materialized_data:
      schema_id: schema_monthly_sales_v1
      rows:
        - { row_id: r1, month: "2025-01", sales_amount: 125000.00 }
        - { row_id: r2, month: "2025-02", sales_amount: 118500.50 }
        - { row_id: r3, month: "2025-03", sales_amount: 142300.75 }
        - { row_id: r4, month: "2025-04", sales_amount: 138900.25 }
        - { row_id: r5, month: "2025-05", sales_amount: 155200.00 }
