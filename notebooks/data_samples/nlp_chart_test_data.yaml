  # ===========================================================================
  # TEST CASE 2: Multi-dimensional Sales Analysis (Heatmap)
  # ===========================================================================
  - id: tc_002_sales_by_region_product

    nlp_query: >
      Compare sales by region and product category for Q4 2025, 
      show me which combinations are performing best

    expected_chart:
      id: chart_sales_region_product_v1
      title: Q4 2025 Sales by Region and Product Category
      chart_type: heatmap
      dimensions:
        - field: region
          type: category
        - field: product_category
          type: category
        - field: sales_amount
          type: numeric
      filters:
        - field: quarter
          operator: eq
          value: Q4
        - field: year
          operator: eq
          value: "2025"
      version: 1
      schema_version: 1

    output_schema:
      id: schema_sales_region_product_v1
      version: 1
      fields:
        - name: row_id
          type: STRING
          role: IDENTIFIER
          context: Stable identifier for each region-product combination
        - name: region
          type: STRING
          role: DIMENSION
          context: Geographic sales region
        - name: product_category
          type: STRING
          role: DIMENSION
          context: Product category classification
        - name: sales_amount
          type: FLOAT
          role: MEASURE
          context: Total sales amount in USD
        - name: transaction_count
          type: INTEGER
          role: MEASURE
          context: Number of transactions
      primary_key: [row_id]
      schema_version: 1

