[project]
name = "notebooks"
version = "0.1.0"
description = "Jupyter notebook environment for actBI data exploration"
requires-python = ">=3.12"
dependencies = [
    "shared-io",
    "shared-data",
    "pipelines",
    "agents",
    "prompts",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "pandas>=2.3.3",
    "matplotlib>=3.9.3",
    "duckdb>=1.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooks"]

[tool.uv.sources]
shared-io = { workspace = true }
shared-data = { workspace = true }
pipelines = { workspace = true }
agents = { workspace = true }
prompts = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
