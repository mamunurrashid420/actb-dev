[project]
name = "pipelines"
version = "0.1.0"
description = "Dagster data pipeline for external data ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shared-io",
    "shared-data",
    "dagster>=1.11.16",
    "pandas>=2.3.3",
    "pandera>=0.20.0",
    "pytest>=8.4.2",
    "pytest-xdist>=3.5.0",
    "fredapi>=0.5.2",
    "requests>=2.31.0",
    "pyarrow>=18.1.0",
    "polars>=1.0.0",
    "pyyaml>=6.0",
    "dagster-webserver>=1.11.16",
    "dagster-dg-cli>=1.11.16",
    "dagster-duckdb>=0.28.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "matplotlib>=3.9.3",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "dagster-postgres>=0.28.0",
    "stamina>=25.1.0",
]

[tool.uv.sources]
shared-io = { workspace = true }
shared-data = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: Integration tests (may require external services, skipped on commit)",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["**/*.py"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipelines"
