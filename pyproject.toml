[project]
name = "actbi"
version = "0.1.0"
description = "actBI Monorepo - AI-powered Business Intelligence"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "service",
    "lib/io",
    "lib/data",
    "lib/prompts",
    "pipelines",
    "notebooks",
    "xlake",
    "agents",
    "evals",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["xlake/src/xlake/generated"]  # Auto-generated protobuf files

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # Depends() in function defaults is standard FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"service/src/app/main.py" = ["E402"]  # load_dotenv must run before other imports

[tool.ruff.lint.isort]
known-first-party = ["pipelines", "xlake", "agents", "evals", "shared", "notebooks", "service", "app", "lib"]

[tool.ruff.format]
preview = true

[tool.pyright]
pythonVersion = "3.12"
extraPaths = ["service/src"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pre-commit>=4.0.0",
    "pytest>=8.0",
    "pytest-xdist>=3.0.0",
]
