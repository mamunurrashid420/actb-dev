[project]
name = "xlake"
version = "0.1.0"
description = "XLake semantic layer and unified APIs for actBI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "duckdb>=1.0.0",
    "fsspec>=2024.6.0",
    "gcsfs>=2024.6.1",
    "qdrant-client>=1.9.0",
    "fastembed>=0.2.0",
    "protobuf>=5.27.0",
    "grpcio-tools>=1.64.0",
    # Text splitting for RAG chunking
    "langchain-text-splitters>=0.3.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["**/*.py"]


